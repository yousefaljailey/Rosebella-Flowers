<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Collections — Rosebella</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:      #C6922A;
      --gold-light:#D4A84B;
      --gold-pale: #E8D09A;
      --gold-dim:  rgba(198,146,42,0.12);
      --charcoal:  #2D2D2D;
      --charcoal2: #1a1a1a;
      --ivory:     #FAF8F0;
      --ivory2:    #F3F0E8;
      --taupe:     #8C7B6B;
      --white:     #FFFFFF;
      --serif:     'Cormorant Garamond', Georgia, serif;
      --sans:      'Montserrat', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--ivory); color: var(--charcoal); font-family: var(--sans); overflow-x: hidden; }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; left: 0; width: 100%; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 48px;
      background: rgba(250,248,240,0.97);
      backdrop-filter: blur(16px);
      box-shadow: 0 1px 0 rgba(198,146,42,0.12);
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-wordmark {
      font-family: var(--serif); font-size: 18px; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--charcoal);
    }
    .nav-monogram { width: 32px; height: 32px; }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a {
      font-family: var(--sans); font-size: 10px; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none;
      color: var(--charcoal); transition: color 0.25s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--gold); }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .nav-cta {
      font-family: var(--sans); font-size: 10px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      background: var(--gold); color: var(--white);
      padding: 9px 22px; text-decoration: none; border: none; cursor: pointer;
      transition: background 0.25s;
    }
    .nav-cta:hover { background: var(--gold-light); }
    .nav-cart-btn {
      background: none; border: none; cursor: pointer;
      color: var(--charcoal); position: relative; padding: 4px;
      transition: color 0.25s;
    }
    .nav-cart-btn:hover { color: var(--gold); }
    .cart-badge {
      position: absolute; top: -2px; right: -4px;
      background: var(--gold); color: white; border-radius: 50%;
      width: 16px; height: 16px; font-size: 9px; font-weight: 700;
      font-family: var(--sans); display: flex; align-items: center; justify-content: center;
    }
    .cart-badge.hidden { display: none; }

    /* ── BREADCRUMB ── */
    .breadcrumb {
      padding: 14px 48px;
      font-family: var(--sans); font-size: 11px; color: var(--taupe);
      display: flex; align-items: center; gap: 6px;
      border-bottom: 1px solid var(--gold-dim);
      background: var(--white);
    }
    .breadcrumb a { color: var(--taupe); text-decoration: none; }
    .breadcrumb a:hover { color: var(--gold); }
    .breadcrumb span { color: var(--charcoal); font-weight: 500; }

    /* ── TOP OCCASION PILLS ── */
    .occasion-pills-wrap {
      background: var(--white);
      border-bottom: 1px solid var(--gold-dim);
      padding: 0 48px;
      overflow: hidden;
    }
    .occasion-pills {
      display: flex; gap: 6px; overflow-x: auto; padding: 12px 0;
      scrollbar-width: none;
    }
    .occasion-pills::-webkit-scrollbar { display: none; }
    .occ-pill {
      flex-shrink: 0; display: flex; align-items: center; gap: 6px;
      padding: 7px 16px; border: 1.5px solid rgba(198,146,42,0.3);
      border-radius: 100px; background: none; cursor: pointer;
      font-family: var(--sans); font-size: 11px; font-weight: 500;
      color: var(--charcoal); white-space: nowrap;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .occ-pill:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
    .occ-pill.active {
      background: var(--charcoal2); border-color: var(--charcoal2); color: var(--white);
    }
    .occ-pill-icon { font-size: 14px; }

    /* ── MAIN LAYOUT ── */
    .shop-layout {
      display: flex; align-items: flex-start;
      max-width: 1400px; margin: 0 auto; padding: 0 48px;
      gap: 32px;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 220px; flex-shrink: 0;
      position: sticky; top: 70px;
      max-height: calc(100vh - 80px); overflow-y: auto;
      padding: 24px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--gold-pale) transparent;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--gold-pale); border-radius: 4px; }
    .sidebar-section { margin-bottom: 28px; }
    .sidebar-title {
      font-family: var(--sans); font-size: 10px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--taupe); margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none;
    }
    .sidebar-title svg { transition: transform 0.2s; }
    .sidebar-title.collapsed svg { transform: rotate(-90deg); }
    .sidebar-list { list-style: none; }
    .sidebar-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: 6px; cursor: pointer;
      font-family: var(--sans); font-size: 12px; color: var(--charcoal);
      transition: background 0.18s, color 0.18s;
      position: relative;
    }
    .sidebar-item:hover { background: var(--gold-dim); color: var(--gold); }
    .sidebar-item.active {
      background: var(--gold-dim); color: var(--gold); font-weight: 600;
    }
    .sidebar-item.active::before {
      content: ''; position: absolute; left: 0; top: 20%; bottom: 20%;
      width: 3px; border-radius: 2px; background: var(--gold);
    }
    .sidebar-item-icon { font-size: 14px; }
    .sidebar-item-count {
      margin-left: auto; font-size: 10px; color: var(--taupe);
      background: var(--ivory2); padding: 1px 6px; border-radius: 10px;
    }
    .sidebar-divider {
      height: 1px; background: var(--gold-dim); margin: 4px 0 16px;
    }

    /* Price filter */
    .price-options { display: flex; flex-direction: column; gap: 6px; }
    .price-option {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--sans); font-size: 12px; color: var(--charcoal);
      cursor: pointer; padding: 5px 10px; border-radius: 6px;
      transition: background 0.18s;
    }
    .price-option:hover { background: var(--gold-dim); }
    .price-option input { accent-color: var(--gold); cursor: pointer; }
    .price-option.active { color: var(--gold); font-weight: 600; }

    /* ── MAIN CONTENT ── */
    .shop-main { flex: 1; min-width: 0; padding: 24px 0; }

    .shop-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }
    .shop-title {
      font-family: var(--serif); font-size: 28px; font-weight: 500;
      color: var(--charcoal);
    }
    .shop-title em { color: var(--gold); font-style: italic; }
    .shop-subtitle {
      font-family: var(--sans); font-size: 11px; color: var(--taupe);
      margin-top: 4px;
    }
    .shop-controls { display: flex; align-items: center; gap: 12px; }
    .shop-sort {
      font-family: var(--sans); font-size: 11px; border: 1.5px solid var(--gold-dim);
      background: var(--white); color: var(--charcoal); padding: 8px 12px;
      cursor: pointer; outline: none;
    }
    .mobile-filter-btn {
      display: none; font-family: var(--sans); font-size: 11px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      background: none; border: 1.5px solid var(--gold-dim); color: var(--charcoal);
      padding: 8px 16px; cursor: pointer;
    }

    /* ── PRODUCT GRID ── */
    .prod-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .sp-card {
      background: var(--white);
      border: 1px solid transparent;
      cursor: pointer; overflow: hidden;
      transition: border-color 0.25s, transform 0.25s;
      position: relative;
    }
    .sp-card:hover { border-color: rgba(198,146,42,0.3); transform: translateY(-3px); }
    .sp-card-img {
      width: 100%; aspect-ratio: 3/4; overflow: hidden;
      background: var(--ivory2); position: relative;
    }
    .sp-card-img img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
    }
    .sp-card:hover .sp-card-img img { transform: scale(1.04); }
    .sp-card-img-bg {
      width: 100%; height: 100%;
      background-size: cover; background-position: center;
      transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
    }
    .sp-card:hover .sp-card-img-bg { transform: scale(1.04); }
    .sp-badge {
      position: absolute; top: 12px; left: 12px; z-index: 2;
      font-family: var(--sans); font-size: 9px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 4px 10px;
    }
    .sp-badge-bestseller { background: var(--charcoal2); color: var(--gold-pale); }
    .sp-badge-new { background: var(--gold); color: var(--white); }
    .sp-badge-sale { background: #c0392b; color: var(--white); }
    .sp-wish {
      position: absolute; top: 10px; right: 10px; z-index: 2;
      background: rgba(250,248,240,0.9); border: none; border-radius: 50%;
      width: 32px; height: 32px; font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .sp-wish:hover, .sp-wish.active { background: var(--gold); color: white; }
    .sp-body { padding: 14px 16px 16px; }
    .sp-cat {
      font-family: var(--sans); font-size: 9px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold);
      margin-bottom: 6px; display: block;
    }
    .sp-name {
      font-family: var(--serif); font-size: 17px; font-weight: 500;
      color: var(--charcoal); margin-bottom: 6px; line-height: 1.3;
    }
    .sp-desc {
      font-family: var(--sans); font-size: 11px; color: var(--taupe);
      line-height: 1.5; margin-bottom: 12px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .sp-footer { display: flex; align-items: center; justify-content: space-between; }
    .sp-price {
      font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--charcoal);
    }
    .sp-price .currency { font-size: 12px; font-family: var(--sans); font-weight: 500; color: var(--taupe); margin-right: 2px; }
    .sp-add {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--sans); font-size: 10px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      background: var(--charcoal2); color: var(--white);
      border: none; padding: 9px 18px; cursor: pointer;
      transition: background 0.25s;
    }
    .sp-add:hover { background: var(--gold); }
    .sp-add svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 80px 24px; color: var(--taupe);
    }
    .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-family: var(--serif); font-size: 24px; color: var(--charcoal); margin-bottom: 8px; }
    .empty-state p { font-size: 13px; }

    /* Loading skeleton */
    .skeleton-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .skeleton-card { background: var(--white); }
    .skeleton-img { width: 100%; aspect-ratio: 3/4; background: var(--ivory2); animation: shimmer 1.4s infinite; }
    .skeleton-line { height: 12px; background: var(--ivory2); margin: 10px 16px; border-radius: 4px; animation: shimmer 1.4s infinite; }
    .skeleton-line.short { width: 60%; }
    @keyframes shimmer {
      0%,100% { opacity: 1; } 50% { opacity: 0.5; }
    }

    /* Toast */
    .shop-toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--charcoal2); color: var(--white);
      font-family: var(--sans); font-size: 12px; letter-spacing: 0.06em;
      padding: 12px 28px; z-index: 9999;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
      pointer-events: none; white-space: nowrap;
    }
    .shop-toast.show { transform: translateX(-50%) translateY(0); }

    /* Mobile sidebar overlay */
    .sidebar-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 900;
    }
    .sidebar-overlay.show { display: block; }
    .sidebar-drawer {
      position: fixed; left: 0; top: 0; bottom: 0; width: 280px;
      background: var(--white); z-index: 901; overflow-y: auto;
      padding: 24px 20px;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    .sidebar-drawer.show { transform: translateX(0); }
    .drawer-close {
      position: absolute; top: 16px; right: 16px;
      background: none; border: none; font-size: 20px; cursor: pointer; color: var(--taupe);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 1100px) {
      .prod-grid { grid-template-columns: repeat(2, 1fr); }
      .skeleton-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 900px) {
      .shop-layout { padding: 0 24px; gap: 0; }
      .sidebar { display: none; }
      .mobile-filter-btn { display: flex; align-items: center; gap: 6px; }
      .breadcrumb { padding: 12px 24px; }
      .occasion-pills-wrap { padding: 0 24px; }
    }
    @media (max-width: 600px) {
      nav { padding: 14px 20px; }
      .nav-links { display: none; }
      .breadcrumb { padding: 10px 16px; font-size: 10px; }
      .occasion-pills-wrap { padding: 0 16px; }
      .shop-layout { padding: 0 16px; }
      .prod-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .skeleton-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .shop-title { font-size: 22px; }
    }
  </style>
</head>

  <!-- NAV -->
  <nav>
    <a href="index.html" class="nav-brand">

        <span class="cart-badge hidden" id="cartBadge">0</span>
      </button>
      <a href="index.html" class="nav-cta">Home</a>
    </div>
  </nav>

  <!-- BREADCRUMB -->
  <div class="breadcrumb">
    <a href="index.html">Home</a>
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
    <span id="breadcrumbCurrent">All Collections</span>
  </div>

  <!-- OCCASION PILLS -->
  <div class="occasion-pills-wrap">
    <div class="occasion-pills" id="occasionPills"></div>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="shop-layout">

    <!-- SIDEBAR (desktop) -->
    <aside class="sidebar" id="desktopSidebar">
      <div class="sidebar-section">
        <div class="sidebar-title" onclick="toggleSection(this)">
          Collections
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <ul class="sidebar-list" id="sidebarCollections"></ul>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-section">
        <div class="sidebar-title" onclick="toggleSection(this)">
          Price Range
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <div class="price-options" id="priceOptions">
          <label class="price-option"><input type="radio" name="price" value="all" checked> All Prices</label>

          <label class="price-option"><input type="radio" name="price" value="400-700"> QAR 400 – 700</label>

    <!-- MAIN -->

            Filter
          </button>
          <select class="shop-sort" id="shopSort" onchange="applySortAndFilter()">
            <option value="default">Sort: Default</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name">Name A–Z</option>
          </select>
        </div>
      </div>

      <!-- Product grid -->
      <div id="prodGrid">
        <!-- Loading skeletons -->
        <div class="skeleton-grid" id="skeletonGrid">
          <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
          <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
          <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
          <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>

  </div>

  <!-- MOBILE SIDEBAR OVERLAY -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileFilter()"></div>
  <div class="sidebar-drawer" id="sidebarDrawer">
    <button class="drawer-close" onclick="closeMobileFilter()">✕</button>
    <div style="padding-top:8px;">
      <div class="sidebar-section">
        <div class="sidebar-title">Collections</div>
        <ul class="sidebar-list" id="drawerCollections"></ul>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-section">
        <div class="sidebar-title">Price Range</div>
        <div class="price-options">
          <label class="price-option"><input type="radio" name="priceM" value="all" checked> All Prices</label>
          <label class="price-option"><input type="radio" name="priceM" value="0-200"> Under QAR 200</label>
          <label class="price-option"><input type="radio" name="priceM" value="200-400"> QAR 200 – 400</label>
          <label class="price-option"><input type="radio" name="priceM" value="400-700"> QAR 400 – 700</label>
          <label class="price-option"><input type="radio" name="priceM" value="700+"> QAR 700+</label>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="shop-toast" id="shopToast"></div>

  <script>
    /* ─── STATE ─────────────────────────── */
    let allProducts = [];
    let allCollections = [];
    let activeSlug = 'all';
    let activePriceRange = 'all';

    /* Occasion pill definitions */
    const OCCASION_PILLS = [
      { slug: 'all',                    icon: '✦',  label: 'All' },
      { slug: 'i-love-you',             icon: '❤️',  label: 'Love' },
      { slug: 'birthday-arrangments',   icon: '🎂',  label: 'Birthday' },
      { slug: 'graduation-2025',        icon: '🎓',  label: 'Graduation' },
      { slug: 'eid-collections',        icon: '🌙',  label: 'Eid' },
      { slug: 'anniversary-bouquet',    icon: '💕',  label: 'Anniversary' },
      { slug: 'congratulations',        icon: '🎉',  label: 'Congratulations' },
      { slug: 'mother-day',             icon: '🌷',  label: "Mother's Day" },
      { slug: 'bella-roses',            icon: '🌹',  label: 'Roses' },
      { slug: 'hand-tied-bouquets',     icon: '💐',  label: 'Bouquets' },
      { slug: 'luxury-box-arrangements',icon: '🎁',  label: 'Luxury Box' },
      { slug: 'ramadan-collection',     icon: '🌙',  label: 'Ramadan' },
      { slug: 'new-collection',         icon: '✨',  label: 'New' },
      { slug: 'welcome-baby',           icon: '👶',  label: 'Baby' },
      { slug: 'get-well-soon',          icon: '🌼',  label: 'Get Well' },
      { slug: 'qatar-national-day',     icon: '🇶🇦',  label: 'Qatar Day' },
    ];

    /* ─── CART BADGE ─────────────────────── */
    function updateCartBadge() {
      try {
        const cart = JSON.parse(localStorage.getItem('rosebella_cart')) || [];
        const count = cart.reduce((s, i) => s + (i.qty || 1), 0);
        const badge = document.getElementById('cartBadge');
        badge.textContent = count;
        badge.classList.toggle('hidden', count === 0);
      } catch(e) {}
    }
    function goToCart() { window.location.href = 'index.html#cart'; }
    updateCartBadge();

    /* ─── TOAST ─────────────────────────── */
    function showToast(msg) {
      const t = document.getElementById('shopToast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    /* ─── ADD TO CART ─────────────────────── */
    function addToCart(name, price, currency, imgSrc) {
      try {
        const cart = JSON.parse(localStorage.getItem('rosebella_cart')) || [];
        const existing = cart.find(i => i.name === name);
        if (existing) { existing.qty = (existing.qty || 1) + 1; }
        else { cart.push({ name, price, currency, img: imgSrc, qty: 1 }); }
        localStorage.setItem('rosebella_cart', JSON.stringify(cart));
        updateCartBadge();
        showToast('✦ Added to your gift bag');
      } catch(e) {}
    }

    /* ─── FETCH & PARSE PRODUCTS ────────────── */
    async function loadProducts() {
      try {
        const res = await fetch('index.html?t=' + Date.now());
        const html = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        /* Parse products */
        const cards = doc.querySelectorAll('.prod-card');
        const products = [];
        cards.forEach(card => {
          const cat = card.dataset.cat || '';
          const catNameEl = card.querySelector('.prod-cat');
          const catName = catNameEl ? catNameEl.textContent.trim() : cat;
          const nameEl = card.querySelector('h3');
          const name = nameEl ? nameEl.textContent.trim() : '';
          const descEl = card.querySelector('.prod-desc');
          const desc = descEl ? descEl.textContent.trim() : '';
          const badgeEl = card.querySelector('.prod-badge');
          const badge = badgeEl ? badgeEl.textContent.trim() : '';

          /* Extract image */
          let imgSrc = '';
          const imgEl = card.querySelector('.prod-img-bg');
          if (imgEl) {
            const bgImg = imgEl.style.backgroundImage;
            if (bgImg && bgImg !== 'none') {
              imgSrc = bgImg.replace(/url\(["']?/, '').replace(/["']?\)$/, '');
            }
          }
          if (!imgSrc) {
            const realImg = card.querySelector('.prod-img img');
            if (realImg) imgSrc = realImg.src || realImg.dataset.src || '';
          }

          /* Extract price */
          const priceEl = card.querySelector('.prod-price');
          let price = 0; let currency = 'QAR';
          if (priceEl) {
            const currEl = priceEl.querySelector('.currency');
            if (currEl) { currency = currEl.textContent.trim(); }
            const raw = priceEl.textContent.replace(/[^\d.]/g, '');
            price = parseFloat(raw) || 0;
          }

          if (name) {
            products.push({ cat, catName, name, desc, badge, imgSrc, price, currency });
          }
        });

        /* Parse collections */
        const collCards = doc.querySelectorAll('.coll-card');
        const collections = [{ slug: 'all', name: 'All Collections', icon: '✦' }];
        const seenSlugs = new Set(['all']);
        collCards.forEach(card => {
          try {
            const u = new URL(card.href, location.href);
            const slug = u.searchParams.get('cat') || '';
            if (slug && !seenSlugs.has(slug)) {
              seenSlugs.add(slug);
              const nameEl = card.querySelector('.coll-name');
              const iconEl = card.querySelector('.coll-icon');
              collections.push({
                slug,
                name: nameEl ? nameEl.textContent.trim() : slug,
                icon: iconEl ? iconEl.textContent.trim() : '🌸',
              });
            }
          } catch(e) {}
        });

        allProducts = products;
        allCollections = collections;
        buildSidebar();
        buildOccasionPills();
        renderProducts();
      } catch(err) {
        console.error('Failed to load products:', err);
        document.getElementById('skeletonGrid').style.display = 'none';
        document.getElementById('productGrid').style.display = 'grid';
        document.getElementById('shopSubtitle').textContent = 'Could not load products. Please refresh.';
      }
    }

    /* ─── BUILD SIDEBAR ─────────────────── */
    function buildSidebar() {
      const listHTML = allCollections.map(c => {
        const count = c.slug === 'all' ? allProducts.length
          : allProducts.filter(p => p.cat === c.slug).length;
        return `<li class="sidebar-item${c.slug === activeSlug ? ' active' : ''}"
          onclick="selectCollection('${c.slug}','${c.name.replace(/'/g,"\\'")}')">
          <span class="sidebar-item-icon">${c.icon}</span>
          ${c.name}
          <span class="sidebar-item-count">${count}</span>
        </li>`;
      }).join('');
      document.getElementById('sidebarCollections').innerHTML = listHTML;
      document.getElementById('drawerCollections').innerHTML = listHTML;
    }

    /* ─── BUILD OCCASION PILLS ─────────── */
    function buildOccasionPills() {
      const pillsEl = document.getElementById('occasionPills');
      pillsEl.innerHTML = OCCASION_PILLS.map(p => {
        const exists = p.slug === 'all' || allCollections.some(c => c.slug === p.slug);
        if (!exists) return '';
        return `<button class="occ-pill${p.slug === activeSlug ? ' active' : ''}"
          onclick="selectCollection('${p.slug}','${p.label}')">
          <span class="occ-pill-icon">${p.icon}</span>${p.label}
        </button>`;
      }).join('');
    }

    /* ─── SELECT COLLECTION ─────────────── */
    function selectCollection(slug, name) {
      activeSlug = slug;
      // Update breadcrumb
      document.getElementById('breadcrumbCurrent').textContent = name;
      // Update title
      const titleEl = document.getElementById('shopTitle');
      if (slug === 'all') {
        titleEl.innerHTML = 'Every <em>moment</em> deserves flowers';
      } else {
        titleEl.innerHTML = `<em>${name}</em>`;
      }
      applySortAndFilter();
      updateActiveStates();
      closeMobileFilter();
    }

    /* ─── PRICE FILTER ───────────────────── */
    document.querySelectorAll('input[name="price"], input[name="priceM"]').forEach(input => {
      input.addEventListener('change', () => {
        activePriceRange = input.value;
        // Sync the other group
        document.querySelectorAll('input[name="price"], input[name="priceM"]').forEach(i => {
          if (i.value === activePriceRange) i.checked = true;
        });
        applySortAndFilter();
      });
    });

    /* ─── FILTER & SORT ─────────────────── */
    function applySortAndFilter() {
      let filtered = allProducts.filter(p => activeSlug === 'all' || p.cat === activeSlug);

      /* Price filter */
      if (activePriceRange !== 'all') {
        const [minS, maxS] = activePriceRange.split('-');
        const min = parseFloat(minS) || 0;
        const max = maxS === '+' ? Infinity : (parseFloat(maxS) || Infinity);
        filtered = filtered.filter(p => p.price >= min && p.price <= max);
      }

      /* Sort */
      const sortVal = document.getElementById('shopSort').value;
      if (sortVal === 'price-asc')  filtered.sort((a,b) => a.price - b.price);
      if (sortVal === 'price-desc') filtered.sort((a,b) => b.price - a.price);
      if (sortVal === 'name')       filtered.sort((a,b) => a.name.localeCompare(b.name));

      /* Subtitle */
      document.getElementById('shopSubtitle').textContent =
        `${filtered.length} product${filtered.length !== 1 ? 's' : ''}`;

      renderProductList(filtered);
    }

    /* ─── RENDER PRODUCTS ──────────────── */
    function renderProducts() {
      applySortAndFilter();
      document.getElementById('skeletonGrid').style.display = 'none';
    }

    function renderProductList(products) {
      const grid = document.getElementById('productGrid');
      const empty = document.getElementById('emptyState');

      if (products.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      grid.style.display = 'grid';

      grid.innerHTML = products.map((p, i) => {
        const badgeHTML = p.badge ? `<span class="sp-badge ${getBadgeClass(p.badge)}">${p.badge}</span>` : '';
        const imgHTML = p.imgSrc
          ? `<div class="sp-card-img-bg" style="background-image:url('${escHTML(p.imgSrc)}')"></div>`
          : `<div class="sp-card-img-bg" style="background:linear-gradient(135deg,#e8d09a,#c6922a)"></div>`;

        return `<div class="sp-card" style="animation-delay:${i*0.04}s">
          <div class="sp-card-img">
            ${imgHTML}
            ${badgeHTML}
            <button class="sp-wish" onclick="event.stopPropagation();this.classList.toggle('active')" aria-label="Wishlist">♡</button>
          </div>
          <div class="sp-body">
            <span class="sp-cat">${escHTML(p.catName)}</span>
            <div class="sp-name">${escHTML(p.name)}</div>
            <div class="sp-desc">${escHTML(p.desc)}</div>
            <div class="sp-footer">
              <div class="sp-price"><span class="currency">${escHTML(p.currency)}</span>${p.price}</div>
              <button class="sp-add" onclick="addToCart('${escAttr(p.name)}',${p.price},'${escAttr(p.currency)}','${escAttr(p.imgSrc)}')">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"></path></svg>
                Add
              </button>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function getBadgeClass(badge) {
      const b = badge.toLowerCase();
      if (b.includes('best') || b.includes('popular')) return 'sp-badge-bestseller';
      if (b.includes('new')) return 'sp-badge-new';
      if (b.includes('sale') || b.includes('off')) return 'sp-badge-sale';
      return 'sp-badge-new';
    }

    /* ─── UPDATE ACTIVE STATES ─────────── */
    function updateActiveStates() {
      document.querySelectorAll('.sidebar-item').forEach(el => {
        const onclick = el.getAttribute('onclick') || '';
        const match = onclick.match(/selectCollection\('([^']+)'/);
        el.classList.toggle('active', match && match[1] === activeSlug);
      });
      document.querySelectorAll('.occ-pill').forEach(el => {
        const onclick = el.getAttribute('onclick') || '';
        const match = onclick.match(/selectCollection\('([^']+)'/);
        el.classList.toggle('active', match && match[1] === activeSlug);
      });
    }

    /* ─── SIDEBAR TOGGLE ─────────────────── */
    function toggleSection(titleEl) {
      titleEl.classList.toggle('collapsed');
      const list = titleEl.nextElementSibling;
      if (list) list.style.display = titleEl.classList.contains('collapsed') ? 'none' : '';
    }

    /* ─── MOBILE FILTER ─────────────────── */
    function openMobileFilter() {
      document.getElementById('sidebarOverlay').classList.add('show');
      document.getElementById('sidebarDrawer').classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function closeMobileFilter() {
      document.getElementById('sidebarOverlay').classList.remove('show');
      document.getElementById('sidebarDrawer').classList.remove('show');
      document.body.style.overflow = '';
    }

    /* ─── UTILS ─────────────────────────── */
    function escHTML(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function escAttr(s) { return String(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

    /* ─── URL PARAM: pre-select collection ── */
    (function() {
      const params = new URLSearchParams(location.search);
      const cat = params.get('cat');
      const name = params.get('name');
      if (cat) { activeSlug = cat; }
    })();

    /* ─── INIT ─────────────────────────── */
    loadProducts();
  </script>
</body>
</html>
