<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Rosebella Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=202610041839">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- ── Login ── -->
  <section id="login" hidden>
    <div class="login-card">
      <div class="brand">ROSE<span>BELLA</span></div>
      <div class="login-sub">Admin Portal</div>
      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="username" required>
        <label for="loginPass">Password</label>
        <input id="loginPass" type="password" autocomplete="current-password" required>
        <button class="btn btn-gold btn-block" type="submit">Sign In</button>
      </form>
      <div class="login-err" id="loginErr"></div>
      <div class="login-links">
        <button type="button" class="link-btn" id="forgotBtn">Forgot password?</button>
        <button type="button" class="link-btn" id="verifyBtn" hidden>Send verification email</button>
        <button type="button" class="link-btn" id="createBtn">First time? Create your admin password</button>
      </div>
    </div>
  </section>

  <!-- ── App ── -->
  <div id="app" hidden>
    <aside class="side">
      <div class="brand">ROSE<span>BELLA</span></div>
      <div class="login-sub">Admin Portal</div>
      <button class="nav-btn" data-page="orders">🧾 Orders <span class="count" id="pendingCount" hidden></span></button>
      <button class="nav-btn" data-page="catalog">🌸 Products &amp; Collections</button>
      <button class="nav-btn" data-page="home">🏠 Homepage Sections</button>
      <button class="nav-btn" data-page="customers">👥 Customers</button>
      <div class="nav-sep"></div>
      <button class="nav-btn" data-page="slots">🕐 Delivery Slots</button>
      <button class="nav-btn" data-page="slides">🎬 Hero Slides</button>
      <button class="nav-btn" data-page="extras">🎁 Gift Extras</button>
      <button class="nav-btn" data-page="store">🏬 Store Info</button>
      <button class="nav-btn" data-page="promos">🏷 Promo Codes</button>
      <div class="nav-sep"></div>
      <a class="nav-btn" href="pos.html">🏪 POS Mode</a>
      <a class="nav-btn" id="storefrontLink" target="_blank" rel="noopener">↗ View Storefront</a>
      <button class="nav-btn" id="alertsBtn" type="button">🔔 Order alerts: <b id="alertsState">On</b></button>
      <div class="side-foot">
        <div id="whoami"></div>
        <button class="btn btn-sm btn-ghost" style="color:#fff;border-color:rgba(255,255,255,.2)" onclick="signOut()">Sign out</button>
      </div>
    </aside>

    <main>
      <button class="btn menu-btn" onclick="document.body.classList.toggle('nav-open')">☰ Menu</button>
      <div id="setupBanner" hidden></div>
      <div id="page"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="orderAlerts"></div>

  <script src="js/shared.js?v=202610041839"></script>
  <script src="https://rosebella.qa/js/rb-receipt.js"></script>
  <script src="js/app.js?v=202610041839"></script>
</body>
</html>
